name: Claude

# Responds when you @-mention Claude in an issue or PR comment. Kept separate
# from ci.yml on purpose: that workflow is the test/lint/audit gate and should
# not carry write permissions or a third-party action that can run arbitrary
# code against the repo.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only spend a runner when Claude is actually addressed.
    if: contains(github.event.comment.body || github.event.review.body || github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
