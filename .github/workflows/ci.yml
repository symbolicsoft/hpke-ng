name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - name: cargo fmt
        if: runner.os != 'Windows'
        run: cargo fmt --check
      - name: cargo clippy (default)
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo clippy (pq + hazmat-kat-internals)
        run: cargo clippy --all-targets --features pq,hazmat-kat-internals -- -D warnings
      - name: cargo test
        run: cargo test
      - name: cargo test (pq + hazmat-kat-internals)
        run: cargo test --features pq,hazmat-kat-internals
      - name: cargo test (pq + hazmat-differential + hazmat-kat-internals)
        run: cargo test --features pq,hazmat-differential,hazmat-kat-internals
      - name: cargo build --release
        run: cargo build --release

  no-std:
    name: no-std check (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: thumbv7em-none-eabihf
      - run: cargo check --target thumbv7em-none-eabihf --no-default-features

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --features pq

  fuzz-check:
    name: fuzz targets (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: cargo check (fuzz workspace)
        working-directory: fuzz
        run: cargo check --all-targets
